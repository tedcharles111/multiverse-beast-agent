name: Keep Render Service Alive

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Beast Agent health endpoint
        run: |
          curl -sf -o /dev/null https://multiverse-beast-agent.onrender.com/health
          echo "Ping succeeded"
